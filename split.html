<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Split your Smash Point court cost with your players.">
  <title>Smash Point | Split the cost</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Smash Point home">
        <span class="brand-name">Smash Point</span>
        <span class="brand-tagline">Book a court. Bring your game.</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="split.html" aria-current="page">Split cost</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="split-main page-width">
    <section class="split-intro" aria-labelledby="split-title">
      <p class="eyebrow">🎾 Make it a team plan</p>
      <h1 id="split-title">Split the court cost</h1>
      <p>Enter your court price, hours, and players. See each player's share.</p>
    </section>
    <form class="split-form form-card" id="split-form" novalidate>
      <div class="form-grid">
        <label>
          Court price in rupees
          <input name="price" type="number" min="1" step="1" inputmode="numeric" placeholder="1500" required>
        </label>
        <label>
          Hours
          <input name="hours" type="number" min="1" step="1" inputmode="numeric" placeholder="2" required>
        </label>
        <label>
          Number of players
          <input name="players" type="number" min="1" step="1" inputmode="numeric" placeholder="4" required>
        </label>
      </div>
      <button class="button" type="submit">Split cost</button>
      <p class="field-error" id="split-error" aria-live="polite"></p>
      <div class="confirmation" id="split-result" role="status" aria-live="polite" hidden></div>
    </form>
  </main>

  <footer class="site-footer">
    <p>© 2026 Smash Point, Lahore · Open daily 7:00 am – 11:00 pm</p>
  </footer>
</body>
</html>
